name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Frontend
        run: |
          cd frontend

          # Remove any conflicting env files
          rm -f .env .env.local

          # Create production environment
          cat > .env.production << 'ENVFILE'
          VITE_API_BASE_URL=
          VITE_WS_BASE_URL=
          ENVFILE

          # Install and build
          npm ci
          npm run build

          # Verify no localhost in compiled assets
          if grep -r "localhost:3000" dist/; then
            echo "❌ Error: localhost found in compiled assets!"
            exit 1
          fi

          echo "✅ Frontend built successfully"

      - name: Build Backend
        run: |
          cargo build --release
          echo "✅ Backend built successfully"

      - name: Prepare Release Assets
        run: |
          # Copy binary
          cp target/release/hookshot hookshot-linux-x86_64
          chmod +x hookshot-linux-x86_64

          # Generate checksums
          sha256sum hookshot-linux-x86_64 > hookshot-linux-x86_64.sha256

          # Get binary size
          SIZE=$(du -h hookshot-linux-x86_64 | cut -f1)
          echo "Binary size: $SIZE"
          echo "BINARY_SIZE=$SIZE" >> $GITHUB_ENV

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            hookshot-linux-x86_64
            hookshot-linux-x86_64.sha256
          body: |
            ## Hookshot ${{ steps.version.outputs.VERSION }}

            ### 🚀 Auto-Deployment

            This release will be **automatically deployed** to production VPS via GitHub Actions!

            Watch deployment: [Actions](https://github.com/${{ github.repository }}/actions/workflows/deploy.yml)

            ### 📦 Installation

            **Quick Deploy:**
            ```bash
            ./deploy/deploy-from-release.sh ${{ steps.version.outputs.VERSION }}
            ```

            **Manual Download:**
            ```bash
            curl -L -o hookshot https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/hookshot-linux-x86_64
            chmod +x hookshot
            ./hookshot --help
            ```

            ### 📊 Details

            - **Binary Size:** ${{ env.BINARY_SIZE }}
            - **Platform:** Linux x86_64
            - **Frontend:** Embedded (React + Vite)
            - **Backend:** Rust + Axum
            - **Database:** SQLite

            ### ✅ Checksums

            See `hookshot-linux-x86_64.sha256` for SHA256 checksum.

            To verify:
            ```bash
            sha256sum -c hookshot-linux-x86_64.sha256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
