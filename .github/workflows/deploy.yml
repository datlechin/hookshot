name: Auto Deploy to VPS

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 24700 -H 103.57.220.28 >> ~/.ssh/known_hosts

          # Get release info
          REPO="${{ github.repository }}"
          VERSION="${{ github.event.release.tag_name }}"

          # Deploy
          ssh -p 24700 root@103.57.220.28 bash << 'ENDSSH'
          set -e

          echo "🚀 Auto-deploying new release..."
          echo "Version: ${{ github.event.release.tag_name }}"

          # Download binary
          DOWNLOAD_URL=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }}" | grep "browser_download_url.*hookshot-linux-x86_64\"" | cut -d '"' -f 4)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ Binary not found in release"
            exit 1
          fi

          echo "📥 Downloading from: $DOWNLOAD_URL"
          curl -L -o /tmp/hookshot "$DOWNLOAD_URL"
          chmod +x /tmp/hookshot

          echo "✅ Downloaded: $(du -h /tmp/hookshot | cut -f1)"

          # Deploy
          systemctl stop hookshot
          cp /opt/hookshot/hookshot /opt/hookshot/hookshot.backup.$(date +%Y%m%d-%H%M%S)
          mv /tmp/hookshot /opt/hookshot/hookshot
          chown hookshot:hookshot /opt/hookshot/hookshot
          systemctl start hookshot

          sleep 3

          if systemctl is-active --quiet hookshot; then
            echo "✅ Deployment successful!"
            systemctl status hookshot --no-pager -l | head -10
          else
            echo "❌ Service failed! Rolling back..."
            BACKUP=$(ls -t /opt/hookshot/hookshot.backup.* | head -1)
            cp "$BACKUP" /opt/hookshot/hookshot
            systemctl start hookshot
            exit 1
          fi
          ENDSSH

      - name: Verify Deployment
        if: success()
        run: |
          echo "✅ Successfully deployed ${{ github.event.release.tag_name }}"
          curl -sI https://hook.nqd.vn | head -5
